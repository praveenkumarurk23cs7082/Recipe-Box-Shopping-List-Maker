<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Recipe Box</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=IBM+Plex+Mono:wght@500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="topbar">
  <div class="brand">
    <span class="brand-mark">RB</span>
    <h1>Recipe Box</h1>
  </div>
  <button id="newRecipeBtn" class="btn btn-primary">+ New recipe</button>
</header>

<main>

  <!-- ============ DASHBOARD VIEW ============ -->
  <section id="dashboardView" class="view">

    <div class="filter-row" id="filterRow">
      <!-- chips injected by app.js: All / Breakfast / Dinner / Dessert -->
    </div>

    <div id="statusBanner" class="status-banner" hidden></div>

    <div id="recipeGrid" class="recipe-grid">
      <!-- recipe cards injected by app.js -->
    </div>

    <div id="emptyState" class="empty-state" hidden>
      <p class="empty-title">No recipes yet</p>
      <p class="empty-copy">Add your first recipe and it'll show up here as a card in the box.</p>
      <button class="btn btn-primary" id="emptyStateNewBtn">+ New recipe</button>
    </div>

  </section>

  <!-- ============ FORM VIEW (create / edit) ============ -->
  <section id="formView" class="view" hidden>

    <button class="back-link" id="backToBoardBtn">&larr; Back to recipe box</button>

    <h2 id="formHeading">New recipe</h2>

    <form id="recipeForm" novalidate>
      <input type="hidden" id="recipeId">

      <div class="field">
        <label for="title">Title</label>
        <input type="text" id="title" name="title" placeholder="e.g. Weeknight Chicken Stir-Fry" required maxlength="120">
        <span class="field-error" id="titleError"></span>
      </div>

      <div class="field">
        <label for="imageFile">Recipe photo (optional)</label>
        <input type="file" id="imageFile" accept="image/*">
        <span class="field-hint" id="imageUploadStatus"></span>
        <img id="imagePreview" class="recipe-photo" style="display:none; margin-top:8px;" alt="Preview">
      </div>

      <div class="field-row">
        <div class="field">
          <label for="category">Category</label>
          <select id="category" name="category" required>
            <option value="" disabled selected>Choose one</option>
            <option value="breakfast">Breakfast</option>
            <option value="dinner">Dinner</option>
            <option value="dessert">Dessert</option>
          </select>
        </div>

        <div class="field">
          <label for="prepTime">Prep time (minutes)</label>
          <input type="number" id="prepTime" name="prepTime" min="0" max="999" placeholder="20" required>
        </div>

        <div class="field">
          <label for="servings">Servings</label>
          <input type="number" id="servings" name="servings" min="1" max="99" placeholder="4" required>
        </div>
      </div>

      <div class="field">
        <label for="ingredients">Ingredients</label>
        <span class="field-hint">One ingredient per line — e.g. "2 cups flour"</span>
        <textarea id="ingredients" name="ingredients" rows="8" placeholder="2 cups flour&#10;1 tsp salt&#10;3 large eggs" required></textarea>
        <span class="field-error" id="ingredientsError"></span>
      </div>

      <div class="form-actions">
        <button type="button" class="btn btn-ghost" id="cancelFormBtn">Cancel</button>
        <button type="submit" class="btn btn-primary" id="saveBtn">Save recipe</button>
      </div>
    </form>

  </section>

</main>

<!-- Delete confirmation -->
<div id="deleteDialog" class="dialog-overlay" hidden>
  <div class="dialog">
    <p class="dialog-title">Delete this recipe?</p>
    <p class="dialog-copy">This can't be undone.</p>
    <div class="dialog-actions">
      <button class="btn btn-ghost" id="cancelDeleteBtn">Keep it</button>
      <button class="btn btn-danger" id="confirmDeleteBtn">Delete</button>
    </div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
